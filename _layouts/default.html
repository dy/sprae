<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "Sprae" }} – reactive sprinkles</title>
    <meta name="description" content="{{ page.description | default: 'Sprae is a tiny (~8kb) reactive library for progressive enhancement using signal-powered attributes in HTML/JSX.' }}">

    <meta property="og:title" content="{{ page.title | default: 'Sprae' }} – reactive sprinkles">
    <meta property="og:description" content="{{ page.description | default: 'Sprae is a tiny (~8kb) reactive library for progressive enhancement using signal-powered attributes in HTML/JSX.' }}">

  <body id="page-{{ page.name | default: 'index' | split: '.' | first }}"
    data-fx.once="document.querySelectorAll(':is(h2, h3, h4, h5, h6)[id]:not(.no-toc *)').forEach(function(h) { var a = document.createElement('a'); a.href = '#' + h.id; a.className = 'anchor'; a.textContent = '#'; h.prepend(a) })">
    <a href="#main-content" class="skip-link">Skip to content</a>
    <!-- Spray effect - cursor cloud with inertia -->
    <div id="spray" data-scope="{
      clouds: [],
      mx: 0, my: 0,
      cx: 0, cy: 0,
      vx: 0, vy: 0,
      speed: 0,
      pressed: false,
      mouseEntered: false,
      overContent: false,
      MAX: 48,
      cursorSize: 54,
      cursorIntensity: 0.35,
      cursorOpacity: 1,
      lastTime: 0,
      emitAcc: 0,
      seq: 0,

      init() {
        this.cx = innerWidth / 2
        this.cy = innerHeight / 2
        // seed ambient clouds — part of the page's graphic design, drift slowly
        const base = Math.min(innerWidth, 1200)
        this.clouds = [
          { id: ++this.seq, x: innerWidth * 0.3, y: innerHeight * 0.45, vx: 0.03, vy: 0.06, size: base * 0.5, intensity: 0.65, fade: 1, age: 900, g: 0.0012, amb: 1 },
          { id: ++this.seq, x: innerWidth * 0.2, y: innerHeight * 0.8, vx: -0.02, vy: 0.05, size: base * 0.3, intensity: 0.5, fade: 1, age: 700, g: 0.0012, amb: 1 },
          { id: ++this.seq, x: innerWidth * 0.88, y: innerHeight * 0.16, vx: 0.015, vy: 0.07, size: base * 0.2, intensity: 0.45, fade: 1, age: 500, g: 0.0012, amb: 1 },
        ]
        this.lastTime = performance.now()
        const loop = (now) => {
          const dt = Math.min((now - this.lastTime) / 16.67, 3) // normalize to 60fps, cap at 3x
          this.lastTime = now
          this.update(dt)
          requestAnimationFrame(loop)
        }
        requestAnimationFrame(loop)
      },

      press(e) {
        if (this.overContent) return
        this.mx = e.pageX
        this.my = e.pageY
        this.pressed = true
        this.emitAcc = 5 // first puff right away
      },

      release() {
        // stop spraying — puffs are already out, nozzle eases back in update()
        this.pressed = false
      },

      // continuous spray while pressed: small puffs that fade in — no abrupt blob
      emit(dt) {
        if ((this.emitAcc += dt) < 5) return // ≈ every 80ms at 60fps
        this.emitAcc = 0
        const clouds = [...this.clouds]
        // over budget: let the oldest sprayed cloud dissolve instead of popping out
        if (clouds.length >= this.MAX) {
          const old = clouds.find(c => !c.dying && !c.amb)
          if (old) old.dying = true
        }
        const a = Math.random() * Math.PI * 2, r = this.cursorSize * 0.3 * Math.random()
        clouds.push({
          id: ++this.seq,
          x: this.cx + Math.cos(a) * r,
          y: this.cy + Math.sin(a) * r,
          vx: this.vx * 0.4 + (Math.random() - 0.5) * 0.6,
          vy: this.vy * 0.4 - Math.random() * 0.3,
          size: this.cursorSize * (0.5 + Math.random() * 0.4),
          intensity: 0.2 + Math.random() * 0.15,
          fade: 0,
          age: 0,
          g: 0.0012 // gentle fall — lingers and travels instead of raining off-page
        })
        this.clouds = clouds
      },

      move(e) {
        if (!this.mouseEntered) {
          this.mouseEntered = true
          this.cx = e.pageX
          this.cy = e.pageY
        }
        // hero title/subtitle let the spray through — cloud play starts right at the top
        this.overContent = !!e.target.closest('main') && !e.target.closest('.no-toc')
        this.mx = e.pageX
        this.my = e.pageY
      },

      update(dt = 1) {
        const pageH = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight)

        // Cursor follows mouse - moves fraction of distance each frame (natural ease-out)
        const ease = 1 - Math.pow(0.97, dt)
        this.vx = (this.mx - this.cx) * ease
        this.vy = (this.my - this.cy) * ease
        this.cx += this.vx
        this.cy += this.vy

        // Track speed for transparency effect
        this.speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy)

        // While pressed: nozzle grows and sprays puffs; released: it eases back
        if (this.pressed) {
          this.cursorSize = Math.min(90, this.cursorSize + 0.6 * dt)
          this.cursorIntensity = Math.min(0.7, this.cursorIntensity + 0.04 * dt)
          this.emit(dt)
        } else {
          // Fade cursor based on whether over content
          const targetOpacity = this.overContent ? 0 : 1
          const fadeSpeed = this.overContent ? 0.08 : 0.02
          this.cursorOpacity += (targetOpacity - this.cursorOpacity) * fadeSpeed * dt
          this.cursorSize += (54 - this.cursorSize) * 0.08 * dt
          this.cursorIntensity += (0.35 - this.cursorIntensity) * 0.05 * dt
        }

        // Update released clouds (seeded ambient clouds carry own gravity g)
        for (const c of this.clouds) {
          c.age += dt
          c.vy += (c.g ?? 0.015) * dt
          c.vx *= Math.pow(0.99, dt)
          c.vy *= Math.pow(0.995, dt)
          c.vx += (Math.random() - 0.5) * 0.02 * dt
          c.x += c.vx * dt
          c.y += c.vy * dt

          // Gradually start growing (smooth transition from cursor)
          const growRate = Math.min(1, c.age / 30) * 0.4 / (1 + c.age * 0.008)
          c.size += growRate * dt

          // Fade in fresh puffs; dissolve dying ones
          c.fade = c.dying ? Math.max(0, c.fade - 0.03 * dt) : Math.min(1, c.fade + 0.05 * dt)

          // Very slow intensity fade; ambient seeds don't decay
          if (!c.amb) c.intensity = Math.max(0.05, c.intensity * Math.pow(0.9998, dt))

          // Settle at bottom
          if (c.y > pageH - c.size * 0.3) {
            c.y = pageH - c.size * 0.3
            c.vy = 0
            c.vx *= 0.95
          }

          // Bounce sides
          if (c.x < c.size * 0.3) { c.x = c.size * 0.3; c.vx *= -0.3 }
          if (c.x > innerWidth - c.size * 0.3) { c.x = innerWidth - c.size * 0.3; c.vx *= -0.3 }
        }

        this.clouds = this.clouds.filter(c => !(c.dying && c.fade <= 0))
      },

      vars(x, y, size, intensity, speedFade = 0) {
        const i = intensity
        const fade = Math.max(0, 1 - speedFade * 0.1)  // fade based on speed
        return {
          '--x': x + 'px',
          '--y': y + 'px',
          '--size': size + 'px',
          '--margin': -size * 0.5 + 'px',
          '--blur': size * 0.3 + 'px',
          '--center-l': (0.90 - i * 0.35),
          '--alpha': (0.15 + i * 0.7) * fade,
          '--opacity': 1
        }
      },

      cursorVars() {
        const v = this.vars(this.cx, this.cy, this.cursorSize, this.cursorIntensity, this.speed)
        v['--opacity'] = this.mouseEntered ? this.cursorOpacity : 0
        return v
      },

      cloudVars(c) {
        const v = this.vars(c.x, c.y, c.size, c.intensity)
        v['--alpha'] = (0.15 + c.intensity * 0.7) * c.fade
        return v
      }
    }" data-onmousemove.document="move" data-onmousedown.document="press" data-onmouseup.document="release" data-onblur.window="release" data-fx.once="init()">
      <div class="cloud" data-style="cursorVars()"></div>
      <div class="cloud" data-each="c in clouds" data-style="cloudVars(c)"></div>
    </div>

    <header>
      <nav>
        {% unless page.url == "/" or page.url == "/index.html" %}

        {% endunless %}
        <a href="drops">drops</a>
        <a href="https://github.com/dy/sprae/releases" class="version">v<span data-text="window.sprae?.version || '13.3.8'"></span></a>
        <a href="https://github.com/dy/sprae" class="gh" aria-label="GitHub">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
      </nav>
    </header>

    <main id="main-content">
      <!-- Table of contents - auto-generated from headings -->
      <aside id="toc" data-scope="{
        items: [],
        active: '',
        activeSection: '',

        init() {
          // Collect all h2, h3, h4 headings from main content (excluding .no-toc descendants)
          const headings = document.querySelectorAll('main :not(.no-toc) > :is(h2, h3, h4), main > :is(h2, h3, h4)')
          let currentSection = ''
          this.items = [...headings].map(h => {
            const clone = h.cloneNode(true)
            clone.querySelectorAll('a:not(.anchor)').forEach(a => a.remove())
            const cleanSlug = clone.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-$/, '')
            const item = {
              id: h.id || (h.querySelector('[id]') || {}).id || (h.id = cleanSlug),
              text: clone.textContent.replace(/[#:]/g, '').trim().split('\n')[0].split('=')[0].trim(),
              level: h.tagName === 'H2' ? 2 : h.tagName === 'H3' ? 3 : 4,
              section: ''
            }
            if (item.level === 2) currentSection = item.id
            item.section = currentSection
            return item
          })
          if (this.items.length) {
            this.active = this.items[0].id
            this.activeSection = this.items[0].section
          }
          this.onScroll()
        },

        onScroll() {
          const scrollY = window.scrollY + 100
          let newActive = this.items[0]?.id
          let newSection = this.items[0]?.section
          for (let i = this.items.length - 1; i >= 0; i--) {
            const el = document.getElementById(this.items[i].id)
            if (el && el.offsetTop <= scrollY) {
              newActive = this.items[i].id
              newSection = this.items[i].section
              break
            }
          }
          if (newActive !== this.active) {
            this.active = newActive
            this.activeSection = newSection
            setTimeout(() => {
              const activeEl = document.querySelector('#toc a.active')
              if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' })
            }, 50)
          }
        },

        isVisible(item) {
          return item.level === 2 || item.section === this.activeSection
        },

        goto(id) {
          const el = document.getElementById(id)
          if (el) el.scrollIntoView({ behavior: 'smooth' })
        }
      }" data-onscroll.window.throttle-50="onScroll" data-fx.once="init()">
        <nav data-if="items.length >= 3">
          <a data-each="item in items" data-if="isVisible(item)" data-href="'#' + item.id" data-text="item.text" data-onclick.prevent="goto(item.id)" data-class="{active: active === item.id, indent: item.level >= 3, 'indent-2': item.level === 4}"></a>
        </nav>
      </aside>

      <div class="content">
        {{ content }}
      </div>
    </main>

    <footer>
      <a href="https://github.com/dy/sprae/blob/main/license">MIT</a>

    </footer>

  </body>
